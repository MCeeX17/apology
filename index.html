<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For Itumeleng 🌹</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="glow-bg"></div>
  <canvas id="canvas"></canvas>

  <main class="container" id="mainCard">
    <div class="flower-icon" id="headerEmoji">🌹</div>
    <div class="badge" id="badgeText">For Itumeleng</div>

    <div class="step-card">
      <p class="message-text" id="messageText">
        Hey Itumeleng... I made a little something for you. 🌸
      </p>
    </div>

    <div class="controls">
      <button class="btn" id="nextBtn" onclick="nextStep()">
        <span id="btnText">Read next line 💕</span>
      </button>
    </div>

    <div class="progress-dots" id="dotsContainer"></div>

    <p class="footer-note" id="authorTag">From Mopeli Mopeli</p>
  </main>

  <div class="flower-overlay" id="flowerOverlay">
    <div class="bouquet-display">🌸 🌹 🌺 🌻 💐 🌷</div>
    <div class="overlay-text">Here are some flowers for you 🌸✨</div>
    <div class="overlay-signature">From Mopeli Mopeli</div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
